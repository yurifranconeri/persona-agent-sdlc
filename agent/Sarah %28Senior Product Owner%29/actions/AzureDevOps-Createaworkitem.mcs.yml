mcs.metadata:
  componentName: Azure DevOps - Create a work item
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: account
    value: CopilotStudioTests

  - kind: ManualTaskInput
    propertyName: project
    value: PersonaAgents

  - kind: AutomaticTaskInput
    propertyName: type

  - kind: AutomaticTaskInput
    propertyName: description
    description: Descrição formatada em Markdown com quebra de linha e legível

modelDisplayName: Criar um Work Item
modelDescription: Criar um Work Item
outputs:
  - propertyName: fields
    name: fields

  - propertyName: id
    name: Id
    description: The unique id of the work item.

  - propertyName: rev
    name: Revision Count
    description: The revision count of the work item.

  - propertyName: url
    name: URL
    description: The URL of the work item.

