mcs.metadata:
  componentName: Escalar
  description: |-
    Este tópico de sistema é acionado quando o utilizador indica que pretende falar com um representante.
    É possível configurar a forma como o agente vai processar cenários de transferência para seres humanos nas definições do agente.
    Se o agente não processar escalamentos, este tópico deve ser desativado.
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
