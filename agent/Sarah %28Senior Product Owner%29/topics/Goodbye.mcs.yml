mcs.metadata:
  componentName: Adeus
  description: Este tópico é acionado quando o utilizador se despede. Por predefinição, a conversação não é terminada. Se pretender terminar a conversação quando o utilizador se despedir, pode adicionar uma ação "Fim da Conversação" a este tópico ou redirecionar para o tópico de sistema "Fim da Conversação".
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Adeus
    includeInOnSelectIntent: false
    triggerQueries:
      - Até logo
      - Adeus
      - Até já
      - Até à próxima
      - Até à vista
      - Não, obrigado. Adeus.
      - Não, obrigada. Adeus.
      - Até mais logo
      - Tchau

  actions:
    - kind: Question
      id: question_zf2HhP
      variable: Topic.EndConversation
      prompt: Pretende terminar a nossa conversação?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: condition_DGc1Wy
      conditions:
        - id: condition_DGc1Wy-item-0
          condition: =Topic.EndConversation = true
          actions:
            - kind: BeginDialog
              id: dn94DC
              dialog: pa_sarah.topic.EndofConversation

        - id: condition_DGc1Wy-item-1
          condition: =Topic.EndConversation = false
          actions:
            - kind: SendActivity
              id: sendMessage_LdLhmf
              activity: Continue. Estou a ouvir.